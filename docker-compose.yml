# Workers, MCP-server, HTTPS (Caddy) en backups op een VPS:  docker compose up -d --build
# Zie docs/deploy.md. De web-app draait op Vercel.
# Env staat in .env.production (zelfde variabelen als .env.example; DATABASE_URL naar Supabase).
services:
  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    env_file: .env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # health alleen lokaal; uptime-check via reverse proxy of tunnel
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    env_file: .env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3333:3333" # publiek via de reverse proxy (HTTPS), zie docs/runbook.md
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3333/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Extra worker zonder scheduler (opschalen: docker compose up -d --scale worker-extra=2)
  worker-extra:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    env_file: .env.production
    environment:
      SCHEDULER_ENABLED: "false"
    restart: unless-stopped
    profiles: ["scale"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # HTTPS voor de MCP-server (Let's Encrypt). Vereist DNS van MCP_DOMAIN naar deze server.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [mcp]

  # Dagelijkse pg_dump naar ./backups (14 dagen bewaren). pg_dump-versie >= die van de database (17).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      BACKUP_DIR: /backups
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint:
      ["/bin/sh", "-c", "while true; do sh /backup.sh || echo 'backup mislukt'; sleep 86400; done"]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
