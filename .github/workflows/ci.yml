name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,mailpit,realtime
      - run: pnpm db:reset
      - name: Types zijn up-to-date
        run: pnpm db:types && git diff --exit-code packages/db/src/database.gen.ts
      - run: pnpm test:db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Supabase starten
        # Een runner had poort 54322 al bezet; maak de poorten vrij en probeer zo nodig opnieuw.
        run: |
          start() { pnpm exec supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,realtime; }
          sudo fuser -k 54321/tcp 54322/tcp 54323/tcp 54324/tcp 2>/dev/null || true
          start || { pnpm exec supabase stop --no-backup || true; sleep 5; sudo fuser -k 54321/tcp 54322/tcp 2>/dev/null || true; start; }
      - run: pnpm db:reset
      - run: sh scripts/ci-env.sh .env.local
      # Productie-build: vangt ook imports die alleen in de build falen (bv. node: in een client-bundle).
      - run: pnpm --filter web build
        env: { NODE_ENV: production }
      - name: Web en MCP starten
        run: |
          (cd apps/web && NODE_ENV=production pnpm start > ../../web.log 2>&1 &)
          (pnpm --filter mcp start > mcp.log 2>&1 &)
          (pnpm --filter workers dev > workers.log 2>&1 &)
          npx --yes wait-on@8 -t 60000 http://localhost:3000/api/health http://localhost:3333/health http://localhost:8080/health
      - run: pnpm e2e
      - name: Logs bij een fout
        if: failure()
        run: tail -n 100 web.log mcp.log workers.log
